<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashIQ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #f4f6f8; text-align: center; }
        .card { background: #fff; padding: 20px; border-radius: 12px; max-width: 360px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background: #24a1de; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Add Expense</h3>
        <form action="https://somethinghappened.app.n8n.cloud/webhook/cashiq-submit" method="POST">
            <input type="text" name="title" placeholder="Expense Title" required />
            <input type="number" name="amount" placeholder="Amount" step="0.01" required />
            <button type="submit">Submit Expense</button>
        </form>
    </div>
</body>
</html>
