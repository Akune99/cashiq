<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashIQ - Recurring Expenses</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f8);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #24a1de);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 22px;
            font-weight: 700;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--button-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-primary {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }

        .btn-secondary {
            background-color: rgba(0,0,0,0.05);
            color: var(--hint-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Add Recurring Expense</h2>
    
    <div class="card">
        <form id="recurringForm" onsubmit="return handleSubmit(event);">
            <!-- Hidden input for ID when updating existing items -->
            <input type="hidden" id="editId" value="">

            <div class="form-group">
                <label for="title">Expense Title</label>
                <input type="text" id="title" placeholder="e.g., Netflix, Gym, Rent" required>
            </div>

            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="frequency">Frequency</label>
                <select id="frequency">
                    <option value="monthly" selected>Monthly</option>
                    <option value="yearly">Yearly</option>
                    <option value="weekly">Weekly</option>
                </select>
            </div>

            <div class="form-group">
                <label for="billingDay">Billing Day (1-31)</label>
                <input type="number" id="billingDay" min="1" max="31" value="1" required>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="handleCancel()">Cancel</button>
                <button type="submit" class="btn-primary">Save Expense</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Initialize Telegram WebApp SDK
    const tg = window.Telegram.WebApp;

    // Expand view and notify Telegram environment
    tg.ready();
    tg.expand();

    function handleSubmit(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        try {
            const id = document.getElementById('editId').value;
            const title = document.getElementById('title').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const frequency = document.getElementById('frequency').value;
            const billingDay = parseInt(document.getElementById('billingDay').value, 10);

            if (!title || isNaN(amount) || amount <= 0) {
                return false;
            }

            // Construct exact payload for n8n Switch node
            const payload = {
                action: id ? 'update' : 'create',
                data: {
                    id: id ? parseInt(id, 10) : Date.now(),
                    title: title,
                    amount: amount,
                    frequency: frequency,
                    billingDay: billingDay
                }
            };

            const jsonString = JSON.stringify(payload);

            // Transmit payload via WebApp SDK and close modal
            if (tg && typeof tg.sendData === 'function') {
                tg.sendData(jsonString);
                tg.close();
            } else {
                console.error("tg.sendData is not supported in this context.");
            }
        } catch (err) {
            console.error("Error submitting form:", err);
        }

        return false;
    }

    function handleCancel() {
        if (tg) {
            tg.close();
        }
    }
</script>

</body>
</html>
