<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashIQ - Test</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: var(--tg-theme-button-color, #24a1de);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <button onclick="sendTestPayload()">Send Test Payload to n8n</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function sendTestPayload() {
            const testData = {
                action: "test",
                message: "Hello from minimal test button",
                timestamp: Date.now()
            };

            if (tg && typeof tg.sendData === 'function') {
                tg.sendData(JSON.stringify(testData));
                tg.close();
            } else {
                alert("Telegram WebApp SDK not detected or sendData unavailable.");
            }
        }
    </script>
</body>
</html>
