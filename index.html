<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashIQ - Recurring Expenses</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f8);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #24a1de);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .btn-add {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 12px;
        }

        /* Modal Overlay for Form */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: 14px;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--button-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }

        .btn-secondary {
            background-color: rgba(0,0,0,0.05);
            color: var(--hint-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2>Recurring Expenses</h2>
        <button class="btn-add" onclick="openModal()">+ Add New Expense</button>
    </div>

    <!-- Expense List Placeholder -->
    <div id="expenseList">
        <div class="card">
            <p style="margin:0; color: var(--hint-color); text-align: center;">Tap '+ Add New Expense' to get started.</p>
        </div>
    </div>
</div>

<!-- Modal Form -->
<div id="expenseModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-top:0; margin-bottom:16px;">Add Recurring Expense</h3>
        <form id="recurringForm" onsubmit="return handleSubmit(event);">
            <input type="hidden" id="editId" value="">

            <div class="form-group">
                <label for="title">Expense Title</label>
                <input type="text" id="title" placeholder="e.g., Netflix, Gym, Rent" required>
            </div>

            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="frequency">Frequency</label>
                <select id="frequency">
                    <option value="monthly" selected>Monthly</option>
                    <option value="yearly">Yearly</option>
                    <option value="weekly">Weekly</option>
                </select>
            </div>

            <div class="form-group">
                <label for="billingDay">Billing Day (1-31)</label>
                <input type="number" id="billingDay" min="1" max="31" value="1" required>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-primary">Save Expense</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Initialize Telegram WebApp SDK
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function openModal() {
        document.getElementById('editId').value = '';
        document.getElementById('title').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('frequency').value = 'monthly';
        document.getElementById('billingDay').value = '1';
        document.getElementById('modalTitle').innerText = 'Add Recurring Expense';
        document.getElementById('expenseModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('expenseModal').classList.remove('active');
    }

    function handleSubmit(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        try {
            const id = document.getElementById('editId').value;
            const title = document.getElementById('title').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const frequency = document.getElementById('frequency').value;
            const billingDay = parseInt(document.getElementById('billingDay').value, 10);

            if (!title || isNaN(amount) || amount <= 0) {
                return false;
            }

            const payload = {
                action: id ? 'update' : 'create',
                data: {
                    id: id ? parseInt(id, 10) : Date.now(),
                    title: title,
                    amount: amount,
                    frequency: frequency,
                    billingDay: billingDay
                }
            };

            const jsonString = JSON.stringify(payload);

            if (tg && typeof tg.sendData === 'function') {
                tg.sendData(jsonString);
                tg.close();
            } else {
                console.error("tg.sendData unavailable");
            }
        } catch (err) {
            console.error("Submission error:", err);
        }

        return false;
    }
</script>

</body>
</html>
