<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CashIQ - Recurring Expenses</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--telegram-bg-color, #f4f6f8);
            --card-bg: var(--telegram-secondary-bg-color, #ffffff);
            --text-color: var(--telegram-text-color, #1c1c1e);
            --hint-color: var(--telegram-hint-color, #8e8e93);
            --button-color: var(--telegram-button-color, #007aff);
            --button-text-color: var(--telegram-button-text-color, #ffffff);
            --input-bg: var(--telegram-bg-color, #f4f6f8);
            --danger-color: #ff3b30;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; }

        /* Navigation Tabs */
        .tabs { display: flex; background: var(--card-bg); border-radius: 10px; padding: 4px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--hint-color); font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
        .tab-btn.active { background: var(--button-color); color: var(--button-text-color); }

        /* Views */
        .view { display: none; }
        .view.active { display: block; }

        /* Card & Forms */
        .card { background: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--hint-color); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); background-color: var(--input-bg); color: var(--text-color); font-size: 16px; outline: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .submit-btn { width: 100%; padding: 14px; margin-top: 8px; border-radius: 10px; border: none; background-color: var(--button-color); color: var(--button-text-color); font-size: 16px; font-weight: 600; cursor: pointer; }
        .submit-btn:disabled { opacity: 0.6; }

        /* Expense List Item */
        .expense-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.06); padding-bottom: 12px; margin-bottom: 12px; }
        .expense-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .expense-title { font-weight: 600; font-size: 16px; }
        .expense-sub { font-size: 13px; color: var(--hint-color); margin-top: 2px; }
        .expense-amount { font-weight: 700; font-size: 16px; text-align: right; }
        
        .action-btns { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
        .btn-sm { padding: 6px 12px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-edit { background: rgba(0, 122, 255, 0.1); color: var(--button-color); }
        .btn-delete { background: rgba(255, 59, 48, 0.1); color: var(--danger-color); }

        .empty-state { text-align: center; color: var(--hint-color); padding: 24px; font-size: 14px; }
        .status-msg { margin-top: 10px; font-size: 14px; text-align: center; display: none; }
        .status-msg.error { color: var(--danger-color); }
        .status-msg.success { color: #34c759; }
    </style>
</head>
<body>

<div class="container">
    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('list')">My Expenses</button>
        <button class="tab-btn" onclick="switchTab('form')">+ Add New</button>
    </div>

    <!-- LIST VIEW -->
    <div id="listView" class="view active">
        <div id="expenseListContainer">
            <div class="empty-state">Loading expenses...</div>
        </div>
    </div>

    <!-- FORM VIEW (Add / Edit) -->
    <div id="formView" class="view">
        <div class="card">
            <h3 id="formTitle" style="margin-bottom: 16px;">Add Expense</h3>
            <form id="expenseForm">
                <input type="hidden" id="expense_id" name="expense_id">
                <input type="hidden" id="telegram_id" name="telegram_id">
                <input type="hidden" id="username" name="username">

                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g. Netflix, Rent" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" name="amount" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category">
                            <option value="Subscriptions">Subscriptions</option>
                            <option value="Housing">Housing</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Insurance">Insurance</option>
                            <option value="Loans">Loans</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="frequency">Frequency</label>
                        <select id="frequency" name="frequency">
                            <option value="Monthly">Monthly</option>
                            <option value="Weekly">Weekly</option>
                            <option value="Yearly">Yearly</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Save Expense</button>
                <button type="button" id="cancelEditBtn" class="btn-sm" style="width: 100%; margin-top: 8px; display: none;" onclick="resetForm()">Cancel Editing</button>
                <div id="statusMsg" class="status-msg"></div>
            </form>
        </div>
    </div>
</div>

<script>
    const N8N_BASE_URL = 'https://somethinghappened.app.n8n.cloud/webhook';
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const user = tg?.initDataUnsafe?.user;
    const telegramId = user?.id || '';
    const username = user?.username || user?.first_name || '';

    // Helper: Returns local YYYY-MM-DD date string without UTC time zone shifting
    const getLocalToday = () => new Date().toLocaleDateString('en-CA');

    document.getElementById('telegram_id').value = telegramId;
    document.getElementById('username').value = username;
    document.getElementById('date').value = getLocalToday();

    let expensesCache = [];

    // Switch between List and Form Tabs
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

        if (tab === 'list') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('listView').classList.add('active');
            fetchExpenses();
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('formView').classList.add('active');
        }
    }

    // Fetch User Expenses on Load
    async function fetchExpenses() {
        const container = document.getElementById('expenseListContainer');
        container.innerHTML = '<div class="empty-state">Loading expenses...</div>';

        try {
            const res = await fetch(`${N8N_BASE_URL}/cashiq-list`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId })
            });

            if (!res.ok) throw new Error('Failed to fetch');

            const data = await res.json();
            expensesCache = data.expenses || [];
            renderExpenseList(expensesCache);
        } catch (err) {
            container.innerHTML = '<div class="empty-state">Unable to load expenses.</div>';
        }
    }

    // Render Expense Cards
    function renderExpenseList(items) {
        const container = document.getElementById('expenseListContainer');
        if (!items || items.length === 0) {
            container.innerHTML = '<div class="card empty-state">No recurring expenses found.<br><br><button class="btn-sm btn-edit" onclick="switchTab(\'form\')">+ Add Your First Expense</button></div>';
            return;
        }

        container.innerHTML = items.map(item => {
            // Read raw date string directly from database output
            const rawDate = item.date ? String(item.date).split('T')[0] : '';
            return `
            <div class="card">
                <div class="expense-item">
                    <div>
                        <div class="expense-title">${item.title}</div>
                        <div class="expense-sub">${item.category} • ${item.frequency}</div>
                    </div>
                    <div>
                        <div class="expense-amount">$${parseFloat(item.amount).toFixed(2)}</div>
                        <div class="expense-sub">${rawDate}</div>
                    </div>
                </div>
                <div class="action-btns">
                    <button class="btn-sm btn-edit" onclick="startEdit('${item.id}')">✏️ Edit</button>
                    <button class="btn-sm btn-delete" onclick="confirmDelete('${item.id}', '${item.title}')">🗑️ Delete</button>
                </div>
            </div>
        `;
        }).join('');
    }

    // Prepare Form for Editing
    function startEdit(id) {
        const item = expensesCache.find(e => String(e.id) === String(id));
        if (!item) return;

        document.getElementById('expense_id').value = item.id;
        document.getElementById('title').value = item.title;
        document.getElementById('amount').value = item.amount;
        document.getElementById('category').value = item.category;
        document.getElementById('frequency').value = item.frequency;
        
        // Pass string directly from item.date without Date object conversion
        document.getElementById('date').value = item.date ? String(item.date).split('T')[0] : getLocalToday();

        document.getElementById('formTitle').innerText = 'Edit Expense';
        document.getElementById('submitBtn').innerText = 'Update Expense';
        document.getElementById('cancelEditBtn').style.display = 'block';

        switchTab('form');
    }

    // Reset Form back to "Add New"
    function resetForm() {
        document.getElementById('expense_id').value = '';
        document.getElementById('expenseForm').reset();
        document.getElementById('telegram_id').value = telegramId;
        document.getElementById('username').value = username;
        document.getElementById('date').value = getLocalToday();

        document.getElementById('formTitle').innerText = 'Add Expense';
        document.getElementById('submitBtn').innerText = 'Save Expense';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    // Delete Expense Handler
    function confirmDelete(id, title) {
        const doDelete = () => deleteExpense(id);
        if (tg && tg.showConfirm) {
            tg.showConfirm(`Delete "${title}"?`, (confirmed) => {
                if (confirmed) doDelete();
            });
        } else if (confirm(`Delete "${title}"?`)) {
            doDelete();
        }
    }

    async function deleteExpense(id) {
        try {
            const res = await fetch(`${N8N_BASE_URL}/cashiq-delete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, telegram_id: telegramId })
            });

            if (res.ok) {
                fetchExpenses();
            } else {
                alert('Failed to delete expense.');
            }
        } catch (err) {
            alert('Error connecting to server.');
        }
    }

    // Handle Add / Edit Submission
    document.getElementById('expenseForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        submitBtn.disabled = true;
        submitBtn.innerText = 'Saving...';
        statusMsg.style.display = 'none';

        const expenseId = document.getElementById('expense_id').value;
        const isEdit = Boolean(expenseId);
        const endpoint = isEdit ? `${N8N_BASE_URL}/cashiq-update` : `${N8N_BASE_URL}/cashiq-submit`;

        const formData = {
            id: expenseId || undefined,
            telegram_id: telegramId,
            username: username,
            title: document.getElementById('title').value,
            amount: parseFloat(document.getElementById('amount').value),
            category: document.getElementById('category').value,
            frequency: document.getElementById('frequency').value,
            date: document.getElementById('date').value
        };

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                statusMsg.className = 'status-msg success';
                statusMsg.innerText = isEdit ? 'Updated successfully!' : 'Saved successfully!';
                statusMsg.style.display = 'block';

                setTimeout(() => {
                    resetForm();
                    switchTab('list');
                    submitBtn.disabled = false;
                    statusMsg.style.display = 'none';
                }, 800);
            } else {
                throw new Error('Server returned an error');
            }
        } catch (err) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = 'Submission failed. Please try again.';
            statusMsg.style.display = 'block';
            submitBtn.disabled = false;
        }
    });

    // Initialize by fetching list
    fetchExpenses();
</script>

</body>
</html>

```
